name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starter -d starter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://starter:test-only@localhost:5432/starter_test?sslmode=disable
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: bin/ci
      - run: bin/tool govulncheck ./...
      - run: go test -race -tags=integration ./...
      - run: npx playwright install --with-deps chromium
      - run: bin/test-browser
      - run: docker build -t go-template:ci .
      - name: Smoke test production container
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" -e PUBLIC_URL=https://starter.example.test \
            --entrypoint /app/manage go-template:ci migrate
          docker run -d --name starter-container-test --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" -e PUBLIC_URL=https://starter.example.test \
            go-template:ci
          trap 'docker rm -f starter-container-test >/dev/null' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3000/health/ready
          curl -fsS http://127.0.0.1:3000/login >/dev/null
      - name: Smoke test production worker and graceful shutdown
        run: |
          docker run -d --name starter-worker-test --network host \
            -e DATABASE_URL="$TEST_DATABASE_URL" -e PUBLIC_URL=https://starter.example.test \
            --entrypoint /app/worker go-template:ci
          trap 'docker rm -f starter-worker-test >/dev/null' EXIT
          for attempt in {1..20}; do
            if [[ "$(docker logs starter-worker-test 2>&1)" == *'"msg":"worker started"'* ]]; then
              break
            fi
            test "$(docker inspect -f '{{.State.Running}}' starter-worker-test)" = true
            sleep 1
          done
          [[ "$(docker logs starter-worker-test 2>&1)" == *'"msg":"worker started"'* ]]
          docker stop --time 20 starter-worker-test
          test "$(docker inspect -f '{{.State.ExitCode}}' starter-worker-test)" = 0
