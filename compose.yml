services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: starter_development
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter_development"]
      interval: 2s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  riverui:
    image: ghcr.io/riverqueue/riverui:0.19.0
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://starter:local-development-only@postgres:5432/starter_development?sslmode=disable
    ports: ["127.0.0.1:${RIVERUI_PORT:-8087}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres:
