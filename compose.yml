services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: starter_development
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter_development"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres:
